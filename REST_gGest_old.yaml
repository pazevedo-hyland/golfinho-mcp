servers:
  - url: https://golfinhosoftware.pcscloud.net
paths:
  /api/lerDataHora:
    get:
      security:
        - bearerAuth: []
      description: ""
      responses:
        '200':
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataHoraLida:
                    type: string
                    description: "Data/Hora no formato YYYYMMDDHHmmSSCCC ((YYYY: year, MM: month, DD: Day, HH: hour, mm: minutes, SS: seconds, CC: hundredths of a second, CCC: Thousandths of a second)"
  /api/aberturaCaixa:
    post:
      security:
        - bearerAuth: []
      description: ""
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                posto:
                  type: integer
                utilizador:
                  type: integer
                descricao:
                  type: string
                valor:
                  type: number
              required:
